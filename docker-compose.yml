services:
  api:
    build: .
    image: estimador-cag:local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Dentro de la red de Docker, los servicios se alcanzan por su nombre
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://estimador:estimador@postgres:5432/estimador
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Trazas de las llamadas al LLM: panel web en http://localhost:6006
  phoenix:
    image: arizephoenix/phoenix:version-20.20.0
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    restart: unless-stopped

  # Cachés de respuestas del LLM: exacta y semántica (compartidas por la API y Streamlit).
  # Redis Stack incluye el módulo de búsqueda vectorial que necesita la caché semántica.
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      # appendonly: guarda cada escritura en disco, así la caché sobrevive a los reinicios
      REDIS_ARGS: --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Base de datos de la ingesta: seudónimos (RGPD) y trabajos de ingesta
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: estimador
      POSTGRES_PASSWORD: estimador
      POSTGRES_DB: estimador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimador -d estimador"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  phoenix_data:
  redis_data:
  postgres_data:
