[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.3",
    "litellm>=1.106.6",
    "openinference-instrumentation-litellm>=0.1.52",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
estimador-cag = "estimador_cag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
ui = [
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Aviso interno de LiteLLM (tipos TypedDict con ReadOnly); no afecta al proyecto
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/context/examples.py" = ["E501"]  # texto del prompt, no se parte
