[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "arize-phoenix-otel>=0.17.2",
    "es-core-news-sm",
    "faker>=24.0",
    "fastapi>=0.143.3",
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "litellm[mcp]>=1.106.6",
    "openinference-instrumentation-litellm>=0.1.52",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "presidio-analyzer>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "redisvl>=0.31.0",
    "spacy>=3.8",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
estimador-cag = "estimador_cag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
# Modelo de spaCy en español (Presidio). Solo se publica en GitHub Releases, que devolvía 403 a
# los runners de GitHub Actions: se incluye el wheel oficial en vendor/ (mismo sha256)
es-core-news-sm = { path = "vendor/es_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
ui = [
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Las evals llaman al LLM real (cuestan dinero): fuera por defecto, con `pytest -m eval`
addopts = "-m 'not eval'"
markers = ["eval: evals con el golden dataset contra el LLM real (pytest -m eval)"]
filterwarnings = [
    # Aviso interno de LiteLLM (tipos TypedDict con ReadOnly); no afecta al proyecto
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]

[tool.coverage.run]
source = ["app", "evals"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/context/examples.py" = ["E501"]  # texto del prompt, no se parte
"app/schemas/estimation.py" = ["UP042"]  # enums (str, Enum) como pide el contrato del curso
